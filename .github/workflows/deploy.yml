# Manual, protected deployment to the single demo EC2 host (T-502). Requires approval through the
# "production" environment. Deploys an image *digest* and a pinned model manifest digest; the host
# script waits for readiness and rolls back to the previous release if the new one is not ready.
# Required repository variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, DEPLOY_INSTANCE_ID
name: deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Image reference with digest (registry/repo@sha256:...)"
        required: true
      model_manifest_sha256:
        description: "SHA-256 of the promoted model manifest (from ml.promote)"
        required: true
      model_s3_uri:
        description: "S3 prefix of the promoted model artifact"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      # Inputs reach the shell only through env, never through ${{ }} in a script: GitHub pastes
      # those into the script text before Bash parses it, which would let a value run commands.
      - name: Validate inputs
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          MODEL_SHA: ${{ inputs.model_manifest_sha256 }}
          MODEL_S3_URI: ${{ inputs.model_s3_uri }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]] || { echo "digest required"; exit 1; }
          [[ "$MODEL_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "bad model sha"; exit 1; }
          [[ "$MODEL_S3_URI" =~ ^s3://[a-z0-9][a-z0-9.-]*(/[A-Za-z0-9._/-]*)?$ ]] || { echo "bad model uri"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy via SSM Run Command
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          MODEL_SHA: ${{ inputs.model_manifest_sha256 }}
          MODEL_S3_URI: ${{ inputs.model_s3_uri }}
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          # Validated above, so these characters cannot end the quoted arguments on the host.
          PARAMS=$(jq -cn --arg cmd "/opt/fraud/deploy.sh '$IMAGE_DIGEST' '$MODEL_SHA' '$MODEL_S3_URI'" '{commands: [$cmd]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}'
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = "Success" ]
