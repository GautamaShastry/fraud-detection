# Single-host demo topology used by deploy.sh (not HA: Postgres and Redis share the host).
# /opt/fraud/secrets.env is created by the operator from SSM parameters under /fraud/* and holds
# POSTGRES_PASSWORD, FRAUD_APP_DB_PASSWORD, FRAUD_WORKER_DB_PASSWORD, FRAUD_PSEUDONYM_KEY,
# FRAUD_JWT_ISSUER, FRAUD_JWT_AUDIENCE, FRAUD_JWKS_URL, FRAUD_ARCHIVE_URI (s3://bucket/prefix).
name: fraud-prod

x-app: &app
  image: ${FRAUD_IMAGE:?image digest required}
  env_file: [/opt/fraud/secrets.env]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16.6-alpine
    env_file: [/opt/fraud/secrets.env]
    environment:
      POSTGRES_USER: fraud
      POSTGRES_DB: fraud
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-ttl"]
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "FRAUD_OWNER_DSN=postgresql://fraud:$${POSTGRES_PASSWORD}@postgres:5432/fraud python -m src.storage.migrate"]

  api:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
    # The DSN is built here because only a shell expands the password from secrets.env. Values
    # must be URL-safe (openssl rand -hex 32).
    command: ["sh", "-c", "export FRAUD_POSTGRES_DSN=postgresql://fraud_app:$${FRAUD_APP_DB_PASSWORD}@postgres:5432/fraud; rm -rf /tmp/prometheus && mkdir -p /tmp/prometheus && exec uvicorn src.api.app:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log --workers 2"]
    environment:
      FRAUD_REDIS_URL: redis://redis:6379/0
      FRAUD_SCORER_MODE: model
      FRAUD_MODEL_DIR: /models/current
      FRAUD_MODEL_MANIFEST_SHA256: ${FRAUD_MODEL_MANIFEST_SHA256:?pinned model digest required}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes: ["/opt/fraud/models:/models:ro"]
    ports: ["8000:8000"]

  worker:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "export FRAUD_WORKER_POSTGRES_DSN=postgresql://fraud_worker:$${FRAUD_WORKER_DB_PASSWORD}@postgres:5432/fraud; exec python -m src.events.worker"]

volumes:
  pgdata:
